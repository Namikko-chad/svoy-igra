name: svoy_igra_client
description: "Своя игра — client for Android, Windows, Linux and macOS (player, host with pack editor, admin)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.8.0
  shared_preferences: ^2.5.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  video_player: ^2.11.1
  audioplayers: ^6.4.0
  file_picker: ^13.2.0
  app_links: ^7.0.0
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  image: ^4.12.0
  fvp: ^0.39.1
  win32_registry: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Window / menu icon on Linux (read from the bundle by the runner and the .desktop entry).
  assets:
    - assets/icon.png
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
