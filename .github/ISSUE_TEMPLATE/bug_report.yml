name: Bug report / Ошибка
description: Something does not work as expected / Что-то работает не так
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / Версия
      description: Server version (`/api/info`) and client version
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client / Клиент
      multiple: true
      options: [Web, Android, Windows, Linux, macOS, Android TV]
  - type: dropdown
    id: server
    attributes:
      label: How the server runs / Как запущен сервер
      options: [Docker, Binary / из исходников, MikroTik, Other / другое]
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result / Шаги, ожидание и результат
    validations:
      required: true
