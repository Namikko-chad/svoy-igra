# Builds of the apps: desktop (clients/ for Windows, macOS, Linux) and Android
# (clients/ phone APK, tv/ Android TV APK). Flutter builds desktop apps only on their
# own OS, so each runs on its own runner.
#
# Run it by hand (Actions → Builds → Run workflow): the files are the run's artifacts.
# Push a tag vX.Y.Z to also publish them as a GitHub release.
#
# Settings (repository → Settings → Secrets and variables → Actions):
# - secret ANDROID_DEBUG_KEYSTORE: base64 of ~/.android/debug.keystore (`base64 -w0`).
#   APKs are signed with it, so phones update in place and ANDROID_CERT_SHA256 stays
#   valid. Without it every run signs with a new random key.
# - variable APP_LINK_HOST (optional): host whose https://<host>/g/<PIN> links the
#   phone app opens (Android App Links).
name: Builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: clients
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Linux build tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # The app version is the server's release version (backend/app/config/config.go).
      - name: Version
        run: echo "VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' ../backend/app/config/config.go)" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Tests
        if: matrix.name == 'linux'
        run: flutter test

      - name: Build Windows
        if: matrix.name == 'windows'
        run: |
          flutter build windows --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          out="$GITHUB_WORKSPACE/svoy-igra-$VERSION-windows-x64.zip"
          cd build/windows/x64/runner/Release
          7z a -tzip "$out" .
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      # Universal (Apple silicon + Intel), ad-hoc signed, not notarized.
      - name: Build macOS
        if: matrix.name == 'macos'
        run: |
          flutter build macos --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          out="$GITHUB_WORKSPACE/svoy-igra-$VERSION-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/SvoyIgra.app "$out"
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      - name: Build Linux
        if: matrix.name == 'linux'
        run: |
          flutter build linux --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          out="$GITHUB_WORKSPACE/svoy-igra-$VERSION-linux-x64.tar.gz"
          tar -czf "$out" -C build/linux/x64/release --transform 's,^bundle,svoy-igra,' bundle
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: svoy-igra-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  android:
    name: apk-${{ matrix.app }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: clients
            file: svoy-igra
          - app: tv
            file: svoy-igra-tv
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: the APK is signed with a new random key and will not update an installed app."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Version
        run: echo "VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' ../backend/app/config/config.go)" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter test

      - name: Build APK
        env:
          APP_LINK_HOST: ${{ matrix.app == 'clients' && vars.APP_LINK_HOST || '' }}
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          out="$GITHUB_WORKSPACE/${{ matrix.file }}-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-apk
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
